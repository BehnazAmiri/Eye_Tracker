# =============================================================================
# Deep Learning Pipeline Configuration
# =============================================================================

[PATHS]
labels_csv = ../DataMining/results/reports/stage3/stage3_with_labels.csv
trials_dir = ../DataMining/results/reports/final/trials
outputs_dir = outputs
reports_dir = outputs/reports
dl_inputs_dir = outputs/dl_inputs

[DATA]
# Data filtering and preprocessing
parts_filter = Timer-Correct,Timer-No-Correct
aoi_filter = Answer_Area
time_window_s = 9
sampling_rate = 150
# Eye tracking features (13 optimal features)
feature_columns = BPOGX,BPOGY,FPOGD,FPOGX,FPOGY,LPCX,LPCY,LPD,LPUPILD,RPCX,RPCY,RPD,RPUPILD
# Statistical feature engineering (extracts 14 statistics from each feature)
use_statistical_features = False
# Train/test split configuration
test_size = 0.2
random_seed = 42

[TRAINING]
# Training epochs per model type
epochs_mlp = 500
epochs_lstm = 600
epochs_bilstm = 600
epochs_cnn = 600
epochs_cnn1d = 600
epochs_hybrid = 600
epochs_transformer = 600
# Early stopping patience
early_stopping_patience = 60
# Batch sizes
batch_size_mlp = 16
batch_size_lstm = 16
batch_size_bilstm = 16
batch_size_cnn = 16
batch_size_cnn1d = 16
batch_size_hybrid = 16
batch_size_transformer = 16
# Learning rates
learning_rate_mlp = 0.0004
learning_rate_lstm = 0.0004
learning_rate_bilstm = 0.0004
learning_rate_cnn = 0.0008
learning_rate_cnn1d = 0.0008
learning_rate_hybrid = 0.0004
learning_rate_transformer = 0.0004
# Regularization
weight_decay = 0.00005
weight_decay_hybrid = 0.00005
# Manual pos_weight for BCEWithLogitsLoss (optional, overrides auto-computed value)
# Formula: pos_weight = n_class1 / n_class0 to upweight class-1 (RANDOM) errors
# Set to 0 or remove to use auto-computed value from class distribution
pos_weight = 1.5
# Device (cuda or cpu)
device = cuda

[MODEL_MLP]
# Multi-layer perceptron architecture
hidden_dims = 256,128,64,32
dropout = 0.15
use_batch_norm = True

[MODEL_LSTM]
# Long Short-Term Memory network architecture
hidden_size = 384
num_layers = 3
dropout = 0.15
fc_hidden_dim = 192
bidirectional = False
sequence_length = 300

[MODEL_BILSTM]
# Bidirectional LSTM architecture
hidden_size = 384
num_layers = 3
dropout = 0.15
fc_hidden_dim = 192
bidirectional = True
sequence_length = 300

[MODEL_CNN]
# Convolutional Neural Network architecture
num_conv_layers = 4
base_channels = 96
kernel_size = 7
dropout = 0.15
fc_hidden_dim = 192
sequence_length = 300

[MODEL_CNN1D]
# 1D Convolutional Neural Network architecture
num_conv_layers = 4
base_channels = 96
kernel_size = 5
dropout = 0.2
fc_hidden_dim = 128
sequence_length = 300

[MODEL_HYBRID]
# Hybrid CNN-LSTM architecture
cnn_channels = 128
cnn_kernel_size = 5
lstm_hidden_size = 256
lstm_num_layers = 2
dropout = 0.15
fc_hidden_dim = 256
sequence_length = 300

[MODEL_TRANSFORMER]
# Transformer architecture
d_model = 192
nhead = 12
num_layers = 5
dim_feedforward = 768
dropout = 0.15
fc_hidden_dim = 64
sequence_length = 300

[MODEL_RF]
# Random Forest classifier
n_estimators = 200
max_depth = 8
min_samples_split = 10
min_samples_leaf = 4
max_features = sqrt

[MODEL_XGBOOST]
# XGBoost classifier
n_estimators = 150
max_depth = 4
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.8
gamma = 1.0
reg_alpha = 0.5
reg_lambda = 2.0
min_child_weight = 3
