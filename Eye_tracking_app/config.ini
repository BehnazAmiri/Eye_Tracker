; Eye Tracking App configuration (module-scoped)
; This file is for the UI + tracker connection only.

[SCREEN]
width = 0
height = 0
fullscreen = True
topmost = True

[PATHS]
questions_json = inputs/questions.json
question_exams_dir = inputs/question_exams
output_dir = outputs

[EYE_TRACKER]
host = 192.168.0.17
port = 4242
commands =
	<SET ID="ENABLE_SEND_POG_FIX" STATE="1" />,
	<SET ID="ENABLE_SEND_POG_LEFT" STATE="1" />,
	<SET ID="ENABLE_SEND_POG_RIGHT" STATE="1" />,
	<SET ID="ENABLE_SEND_POG_BEST" STATE="1" />,
	<SET ID="ENABLE_SEND_PUPIL_LEFT" STATE="1" />,
	<SET ID="ENABLE_SEND_PUPIL_RIGHT" STATE="1" />,
	<SET ID="ENABLE_SEND_EYE_LEFT" STATE="1" />,
	<SET ID="ENABLE_SEND_EYE_RIGHT" STATE="1" />,
	<SET ID="ENABLE_SEND_BLINK" STATE="1" />,
	<SET ID="ENABLE_SEND_CURSOR" STATE="1" />

[DIMENSIONS]
left_panel_ratio = 0.80
right_panel_ratio = 0.20
question_section_ratio = 0.50
options_section_ratio = 0.50
left_frame_gap_height_ratio = 0.00
question_inner_padx_ratio = 0.05
question_inner_pady_ratio = 0.05
options_frame_padx_ratio = 0.03
options_frame_pady_ratio = 0.05
option_button_spacing_ratio = 0.036
option_button_margin_ratio = 0.08
option_button_columns = 2
submit_padx_ratio = 0.5
submit_pady_ratio = 0.86
submit_width_ratio = 0.9
submit_height_ratio = 0.15
timer_padx_ratio = 0.05
timer_pady_ratio = 0.05

[FONTS]
family = Helvetica
question_size_ratio = 0.025
option_size_ratio = 0.025
timer_size_ratio = 0.08
submit_size_ratio = 0.15

[COLORS]
background = #F0F8FF
question_bg = #F0F8FF
options_bg = #F0F8FF
button_fg = #333333
button_bg = #ADD8E6
selected_fg = #FFFFFF
selected_bg = #005F9E
submit_fg = #FFFFFF
submit_bg = #28A745
timer = #FF0000

[TIMING]
part2_duration = 90
blink_start = 10
blink_interval = 200
auto_continue = 10000000000000

[AOI_COORDINATES]
question_x_min = 0.05
question_y_min = 0.025
question_x_max = 0.75
question_y_max = 0.475
choice_a_x_min = 0.0400
choice_a_y_min = 0.4950
choice_a_x_max = 0.3800
choice_a_y_max = 0.7000
choice_b_x_min = 0.4200
choice_b_y_min = 0.4950
choice_b_x_max = 0.7600
choice_b_y_max = 0.7000
choice_c_x_min = 0.0400
choice_c_y_min = 0.7300
choice_c_x_max = 0.3800
choice_c_y_max = 0.9350
choice_d_x_min = 0.4200
choice_d_y_min = 0.7300
choice_d_x_max = 0.7600
choice_d_y_max = 0.9350
timer_width = 0.08
timer_height = 0.05
