[AOI_COORDINATES]
; Question AOI - exact coordinates from Eye_tracking_app
question_x_min = 0.05
question_y_min = 0.025
question_x_max = 0.75
question_y_max = 0.475

; Answer Area AOI - unified area covering ALL choices and gaps between them
; INCLUDES transition zone (gap) from Question end (y=0.475) to first Choice (y=0.495)
; Research shows: This 0.020 gap is part of decision-making (gaze transitions Q→Choices)
; Excluding the gap reduces detection rate by 6 trials (387→381)
; X range covers all choices (min of A/C to max of B/D) INCLUDING horizontal gap
answer_area_x_min = 0.0400
answer_area_y_min = 0.4750
answer_area_x_max = 0.7600
answer_area_y_max = 0.9350

; Individual choice coordinates (from Eye_tracking_app config.ini - EXACT values)
; Note: There is a HORIZONTAL GAP between columns (0.38-0.42) and VERTICAL GAP between rows (0.70-0.73)
