[Analysis]
; ==============================================================================
; GLOBAL PARAMETERS
; ==============================================================================
; Eye tracker sampling rate (Hz) - used for time-to-sample conversions
gaze_sampling_rate_hz = 150

; Coordinate validity range for AOI mapping (allows small calibration errors)
coordinate_validity_min = -0.05
coordinate_validity_max = 1.05

; Trial exclusion threshold based on overall invalid gaze ratio
; Used by GUI to filter trials before processing
invalid_gaze_threshold = 0.3

; ==============================================================================
; STAGE 1: RULE-BASED QUALITY FILTERING (BPOGV/BKID)
; ==============================================================================
; Sample validity rules:
;   1) If BPOGV == 1 → sample is VALID
;   2) Else if BKID != 0 (any non-zero value) → sample is VALID (blink detected, acceptable)
;   3) Else (BKID == 0) → sample is INVALID
;
; Trial exclusion: invalid_pct > stage1_invalid_pct_threshold (default 0.30 = 30%)
; Participant exclusion: excluded_trials_pct > stage1_participant_exclusion_threshold (default 0.50 = 50%)
;
; Temporal integrity is preserved: only entire trials/participants are excluded

; Trial-level exclusion threshold (default: 0.30 = 30% invalid samples)
stage1_invalid_pct_threshold = 0.30

; Participant-level exclusion threshold (default: 0.50 = 50% excluded trials)
stage1_participant_exclusion_threshold = 0.50

; Valid values for sample validity checks
stage1_bpogv_valid_value = 1
stage1_bkid_valid_value = 1

; Zero-run detection thresholds (time-based, recommended)
; Question phase: reading question (more tolerance for pauses)
zero_run_threshold_seconds_question_phase = 0.25
; Answer phase: selecting answer (less tolerance, focused task)
zero_run_threshold_seconds_answer_phase = 0.20

; ==============================================================================
; STAGE 2 & 3: REMOVED
; ==============================================================================
; Stage 2 (Outlier Detection) and Stage 3 (Effort Labels) have been removed.
; Pipeline now flows directly: Stage 1 → Stage 4 (AOI Assignment)

; ==============================================================================
; STAGE 2: AOI ASSIGNMENT & TEMPORAL FILTERING (formerly Stage 4)
; ==============================================================================

[STAGE2_TA]
; First Stable Fixation (ta) Detection Parameters
; ================================================
; ta = timestamp of first sample in first stable fixation window where >= 85% of samples
; are on answer AOIs (Choice_A, Choice_B, Choice_C, Choice_D)
;
; Scientific rationale for 500ms window:
;   - Typical fixation duration: 200-400ms
;   - 500ms (75 samples @ 150Hz) captures complete fixation
;   - More sensitive to brief but stable gazes on choices
;   - 85% threshold maintains high confidence (64/75 samples)
;
; Sliding window approach (sample-index based):
;   - Window size = sampling_rate_hz * (ta_window_ms / 1000)
;   - For each position i from 0 to N-window_size:
;       coverage = fraction of answer AOI samples in window
;       if coverage >= ta_answer_coverage_threshold: accept window, stop
;   - ta = FPOGS of first sample in accepted window

; Window duration for stable fixation detection (milliseconds)
; 500ms = more sensitive, captures shorter stable gazes
; 1000ms = more conservative, requires longer stable gaze
ta_window_ms = 1000

; Minimum coverage threshold (fraction of samples on answer AOI in window)
ta_answer_coverage_threshold = 0.85

; Answer AOI name (unified area covering all choices and space between them)
; NEW: Single unified Answer_Area instead of 4 separate choices (Choice_A, B, C, D)
ta_answer_aoi_names = Answer_Area

; ==============================================================================
; STAGE 3: RANDOMNESS LABELS (DATA-DRIVEN THRESHOLDS) (formerly Stage 5)
; ==============================================================================
; Scientific approach: thresholds computed from empirical t_answer distribution

; Threshold computation method:
;   - percentile: Use specified percentile of t_answer distribution (RECOMMENDED - default)
;   - ratio_mean: Use ratio × mean(t_answer) (legacy, kept for backward compatibility)
stage3_threshold_method = percentile

; Percentile value for threshold (when method=percentile)
; Default: 25 (25th percentile = first quartile)
; Interpretation: trials below this percentile are classified as RANDOM (fast responses)
stage3_threshold_percentile = 25

; Ratio of mean t_answer (when method=ratio_mean, legacy fallback)
; Only used if stage3_threshold_method != percentile
random_threshold_ratio = 0.25

; ============================================================================== 
; LEGACY PARAMETERS (kept for backward compatibility, not used in new Stage 1)
; ==============================================================================
invalid_gaze_threshold = 0.3
invalid_gaze_threshold_question_phase = 0.3
invalid_gaze_threshold_answer_phase = 0.3
consecutive_zero_threshold_question_phase = 5
consecutive_zero_threshold_answer_phase = 5
participant_exclusion_threshold = 0.5

